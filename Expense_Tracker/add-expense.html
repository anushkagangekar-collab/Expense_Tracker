<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker - Add Expense</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            Expense Tracker
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="add-expense.html" class="active">Add Expense</a>
            <a href="history.html">History</a>
            <a href="reports.html">Reports</a>
        </nav>

    </header>


    <!-- Add Transaction -->
    <main class="container">

        <h1 class="page-title">
            Add Transaction
        </h1>


        <section class="form-box">

            <h2>Enter Transaction Details</h2>

            <form id="expenseForm">

                <!-- Transaction Name -->
                <div class="form-group">

                    <label for="title">
                        Transaction Name
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Food, Salary, Travel"
                        required
                    >

                </div>


                <!-- Amount -->
                <div class="form-group">

                    <label for="amount">
                        Amount (₹)
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        step="0.01"
                        required
                    >

                </div>


                <!-- Type -->
                <div class="form-group">

                    <label for="type">
                        Transaction Type
                    </label>

                    <select id="type" required>

                        <option value="expense">
                            Expense
                        </option>

                        <option value="income">
                            Income
                        </option>

                    </select>

                </div>


                <!-- Category -->
                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Date -->
                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="btn submit-btn"
                >
                    Add Transaction
                </button>

            </form>

        </section>

    </main>


    <footer>
        <p>
            © 2026 Expense Tracker | JavaScript Group Project
        </p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
